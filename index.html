<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- 不限制 maximum-scale：视力不好的用户需要能双指放大页面（WCAG 1.4.4） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + React + TS</title>
    <script>
      // 访问首页时，在下载 JS 之前就开始请求首页数据（/api 前缀和 axiosInstance 的 baseURL 一致），
      // 结果由 src/pages/home/hooks/useHomeData.ts 通过 SWR 的 preload 接管。
      // 所有路由返回的都是这个 HTML，所以只在首页发，其他页面不发。
      if (location.pathname === '/') {
        window.__HOME_DATA__ = fetch('/api/headerCarousel').then(function (res) {
          return res.ok ? res.json() : Promise.reject(res.status);
        });
        // 先挂一个空的错误处理，避免请求失败时控制台报“未处理的 rejection”；失败后由 useHomeData 重新请求
        window.__HOME_DATA__.catch(function () {});

        // 预加载第一张轮播图（首页的 LCP 元素）。图片地址本来写在接口数据里，要等 JS 下载、执行完，
        // 轮播图渲染出 <img> 才开始下载；这里提前请求，等 <img> 渲染出来时图片已经在缓存里了。
        // 地址写死在这里：后台换了第一张 banner 时要同步修改，否则只是白白多下载一张图，不影响页面显示。
        // 只在首页加，所以放在这个 if 里，没有直接写成 <link> 标签。
        var bannerPreload = document.createElement('link');
        bannerPreload.rel = 'preload';
        bannerPreload.as = 'image';
        bannerPreload.href = '/images/banner1.webp';
        bannerPreload.fetchPriority = 'high';
        document.head.appendChild(bannerPreload);
      }
    </script>
  </head>

  <body>
    <!-- role="main"：页面主体的地标，读屏软件可以直接跳到这里；直接加在 #root 上，不多包一层，不影响页面布局 -->
    <div id="root" role="main"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
